name: Code Coverage
# The mimic unit tests instantiate MimicTTSPlugin and run the `mimic` subprocess,
# so the coverage job needs the `mimic` binary on PATH. mimic is not an apt
# package, so the reusable gh-automations coverage.yml (whose only pre-test hook
# is `system_deps` apt install) can't supply it. This job is therefore
# self-contained: it installs the mimic .deb directly, then runs pytest with
# coverage, mirroring unit_tests.yml.

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Checkout gh-automations scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Mimic
        # The `mimic` TTS binary is required by the unit tests. It is not packaged
        # in the Ubuntu repos, so install the .deb directly from the
        # mycroft-desktop repo (apt-get resolves its deps against the runner repos).
        run: |
          curl -fsSL -o /tmp/mimic.deb \
            "https://forslund.github.io/mycroft-desktop-repo/pool/main/m/mimic/mimic_1.3.0.0_amd64.deb"
          sudo apt-get update -q
          sudo apt-get install -yq /tmp/mimic.deb
          command -v mimic

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov coverage[toml]
          python -m pip install -e ".[test]"

      - name: Run Tests with Coverage
        id: run_tests
        run: |
          python -m pytest \
            test/unittests \
            --cov=ovos_tts_plugin_mimic \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            -v
        # Generate the report even if some tests fail so the PR comment is always posted.
        continue-on-error: true

      - name: Extract Coverage Percentage
        id: extract
        run: |
          if [ -f coverage.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('coverage.json')); print(round(d['totals']['percent_covered'],2))")
          else
            TOTAL=0
          fi
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Write Job Summary
        if: always()
        run: |
          TOTAL="${{ steps.extract.outputs.total }}"
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Coverage | **${TOTAL}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`ovos_tts_plugin_mimic\` |" >> $GITHUB_STEP_SUMMARY

      - name: Format coverage section for PR comment
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PYEOF'
          import json

          try:
              with open("coverage.json") as f:
                  data = json.load(f)
              total = round(data["totals"]["percent_covered"], 1)
              files = data.get("files", {})
          except (FileNotFoundError, KeyError, json.JSONDecodeError):
              total = None
              files = {}

          lines = []
          if total is None:
              lines.append("⚠️ Coverage data unavailable — check the job log.")
          else:
              icon = "✅" if total >= 80 else ("⚠️" if total >= 60 else "❌")
              lines.append(f"{icon} **{total}%** total coverage")

          if files:
              show = files
              lines.append("")
              lines.append(f"<details><summary>Per-file coverage ({len(show)} file{'s' if len(show) != 1 else ''})</summary>")
              lines.append("")
              lines.append("| File | Coverage | Missing lines |")
              lines.append("|------|----------|---------------|")
              for path, info in sorted(show.items(), key=lambda kv: kv[1]["summary"]["percent_covered"]):
                  pct = round(info["summary"]["percent_covered"], 1)
                  missing = info["summary"].get("missing_lines", "?")
                  lines.append(f"| `{path}` | {pct}% | {missing} |")
              lines.append("")
              lines.append("</details>")

          with open("/tmp/coverage-section.md", "w") as f:
              f.write("\n".join(lines))
          PYEOF

      - name: Post coverage section to PR comment
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "coverage" \
            --title "📊 Coverage" \
            --content-file /tmp/coverage-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage XML Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

      # Propagate test failures after the PR comment has been posted.
      - name: Fail job if tests failed
        if: ${{ steps.run_tests.outcome == 'failure' }}
        run: |
          echo "Tests failed — see output above."
          exit 1
