name: TTS Intelligibility
# Inline variant of OpenVoiceOS/gh-automations/.github/workflows/tts-intelligibility.yml@dev.
#
# Mimic needs its `mimic` synthesis binary, which is NOT in the Ubuntu apt repos
# (so the reusable workflow's apt-based `system_deps` input cannot provide it).
# The binary is installed here from the mycroft-desktop .deb — the same step the
# unit-test workflow uses — so get_tts actually synthesises and the round-trip
# produces a real WER score instead of crashing.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  tts-intelligibility:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      MAX_WER: '0.5'
      TEST_PATH: 'test/end2end/test_tts_intelligibility.py'
      INSTALL_EXTRAS: 'test'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout gh-automations scripts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          repository: OpenVoiceOS/gh-automations
          ref: dev
          path: _gh_automations/

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Mimic
        # The `mimic` TTS binary is required to synthesise audio. It is not packaged
        # in the Ubuntu repos, so install the .deb directly from the mycroft-desktop
        # repo (apt-get resolves its deps against the runner repos).
        run: |
          curl -fsSL -o /tmp/mimic.deb \
            "https://forslund.github.io/mycroft-desktop-repo/pool/main/m/mimic/mimic_1.3.0.0_amd64.deb"
          sudo apt-get update -q
          sudo apt-get install -yq /tmp/mimic.deb
          command -v mimic

      - name: Cache models (huggingface + plugin data)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share
          key: tts-intel-models-${{ runner.os }}-3.11-v1
          restore-keys: |
            tts-intel-models-${{ runner.os }}-3.11-

      - name: Install Package with Test Extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-json-report
          echo "Installing ovoscope[tts] from GitHub dev (pre_release)..."
          pip install --force-reinstall \
            "ovoscope[tts] @ git+https://github.com/TigreGotico/ovoscope@dev"
          pip install ".[$INSTALL_EXTRAS]"
          python -c "import ovoscope; print('ovoscope path:', ovoscope.__file__)"

      - name: Run TTS intelligibility tests
        id: run_tests
        continue-on-error: true
        env:
          TTS_MAX_WER: ${{ env.MAX_WER }}
        run: |
          python -m pytest \
            ${{ env.TEST_PATH }} \
            --json-report \
            --json-report-file=/tmp/tts-intel-results.json \
            -v -s 2>&1 | tee /tmp/tts-intel-stdout.txt

      - name: Format TTS intelligibility section for PR comment
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/format_tts_intel.py \
            --json /tmp/tts-intel-results.json \
            --log /tmp/tts-intel-stdout.txt \
            --max-wer "${{ env.MAX_WER }}" \
            --out /tmp/tts-intel-section.md

      - name: Post TTS intelligibility section to PR comment
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 _gh_automations/scripts/update_pr_comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --section-id "tts-intelligibility" \
            --title "🗣️ TTS Intelligibility" \
            --content-file /tmp/tts-intel-section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if tests failed
        if: ${{ steps.run_tests.outcome == 'failure' }}
        run: |
          echo "TTS intelligibility check failed — round-trip unintelligible (mean WER > ${{ env.MAX_WER }}) or the test process errored. See report above."
          exit 1
